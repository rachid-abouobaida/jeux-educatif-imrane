<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="squareGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <filter id="squareShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Square with rounded corners -->
  <rect x="25" y="25" width="150" height="150" rx="26" fill="url(#squareGrad)" stroke="#1E40AF" stroke-width="6" filter="url(#squareShadow)"/>

  <!-- Glossy Highlight -->
  <path d="M 32 45 C 32 35 40 32 50 32 L 150 32 C 160 32 168 35 168 45 C 150 55 50 55 32 45 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="75" cy="95" rx="8" ry="11" fill="#1E293B"/>
  <ellipse cx="125" cy="95" rx="8" ry="11" fill="#1E293B"/>
  <!-- Catchlights -->
  <circle cx="78" cy="91" r="3.5" fill="#FFFFFF"/>
  <circle cx="128" cy="91" r="3.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="62" cy="112" rx="9" ry="5.5" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="138" cy="112" rx="9" ry="5.5" fill="#F472B6" opacity="0.6"/>

  <!-- Big Cheerful Smile -->
  <path d="M 85 110 Q 100 128 115 110" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sparkles -->
  <polygon points="160,40 162,46 168,48 162,50 160,56 158,50 152,48 158,46" fill="#FDE047"/>
  <polygon points="40,150 42,154 46,156 42,158 40,162 38,158 34,156 38,154" fill="#FDE047"/>
</svg>
