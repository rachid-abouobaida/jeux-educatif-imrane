<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="numbg_8" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#00CEC9"/>
      <stop offset="100%" stop-color="#0984E3"/>
    </radialGradient>
    <filter id="shadow_8" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Bubble -->
  <rect x="15" y="15" width="170" height="170" rx="48" fill="url(#numbg_8)" stroke="#1B1464" stroke-width="6" filter="url(#shadow_8)"/>

  <!-- Top shine -->
  <ellipse cx="100" cy="45" rx="55" ry="16" fill="#FFF" opacity="0.35"/>

  <!-- Decorative Sparkles -->
  <circle cx="45" cy="48" r="6" fill="#F9CA24" opacity="0.9"/>
  <circle cx="155" cy="50" r="5" fill="#F9CA24" opacity="0.9"/>
  <circle cx="42" cy="155" r="5" fill="#FFF" opacity="0.8"/>
  <circle cx="158" cy="152" r="7" fill="#F9CA24" opacity="0.9"/>

  <!-- Number 3D Shadow -->
  <text x="100" y="134" font-family="'Fredoka', 'Arial Rounded MT Bold', 'Arial Black', sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#1B1464" opacity="0.4">8</text>

  <!-- Number Face -->
  <text x="100" y="130" font-family="'Fredoka', 'Arial Rounded MT Bold', 'Arial Black', sans-serif" font-size="120" font-weight="900" text-anchor="middle" fill="#FFFFFF">8</text>

  <!-- Cute Kawaii Cheeks & Sparkle on single digit -->
  
  <ellipse cx="72" cy="132" rx="6" ry="3.5" fill="#FF7675" opacity="0.6"/>
  <ellipse cx="128" cy="132" rx="6" ry="3.5" fill="#FF7675" opacity="0.6"/>
  
</svg>