<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="losangeGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="55%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </radialGradient>
    <filter id="losangeShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#4C1D95" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Diamond / Rhombus with gently rounded corners -->
  <path d="M 94 22 
           C 98 16 102 16 106 22 
           L 174 94 
           C 180 98 180 102 174 106 
           L 106 178 
           C 102 184 98 184 94 178 
           L 26 106 
           C 20 102 20 98 26 94 Z" 
        fill="url(#losangeGrad)" stroke="#581C87" stroke-width="6" stroke-linejoin="round" filter="url(#losangeShadow)"/>

  <!-- Glossy Diamond Facet / Highlight -->
  <path d="M 97 28 L 165 96 C 160 98 135 90 100 80 C 65 70 40 98 35 96 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="80" cy="100" rx="7.5" ry="10.5" fill="#1E293B"/>
  <ellipse cx="120" cy="100" rx="7.5" ry="10.5" fill="#1E293B"/>
  <!-- Catchlights -->
  <circle cx="82.5" cy="96" r="3.2" fill="#FFFFFF"/>
  <circle cx="122.5" cy="96" r="3.2" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="66" cy="114" rx="8" ry="5" fill="#F472B6" opacity="0.7"/>
  <ellipse cx="134" cy="114" rx="8" ry="5" fill="#F472B6" opacity="0.7"/>

  <!-- Happy Diamond Smile -->
  <path d="M 90 112 Q 100 126 110 112" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Sparkles -->
  <polygon points="148,45 150,51 156,53 150,55 148,61 146,55 140,53 146,51" fill="#FEF08A"/>
  <circle cx="52" cy="148" r="4" fill="#FFFFFF" opacity="0.85"/>
</svg>
