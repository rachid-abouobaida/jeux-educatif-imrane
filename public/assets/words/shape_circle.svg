<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="circleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF7675"/>
      <stop offset="60%" stop-color="#D63031"/>
      <stop offset="100%" stop-color="#B71540"/>
    </radialGradient>
    <filter id="circleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#800000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Circle -->
  <circle cx="100" cy="100" r="76" fill="url(#circleGrad)" stroke="#961528" stroke-width="6" filter="url(#circleShadow)"/>

  <!-- Glossy Crescent Reflection -->
  <path d="M 45 65 A 64 64 0 0 1 155 65 A 60 48 0 0 0 45 65 Z" fill="#FFFFFF" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="78" cy="98" rx="8" ry="11" fill="#1E293B"/>
  <ellipse cx="122" cy="98" rx="8" ry="11" fill="#1E293B"/>
  <!-- Catchlights -->
  <circle cx="81" cy="94" r="3.5" fill="#FFFFFF"/>
  <circle cx="125" cy="94" r="3.5" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="64" cy="114" rx="8.5" ry="5.5" fill="#FFA5BA" opacity="0.75"/>
  <ellipse cx="136" cy="114" rx="8.5" ry="5.5" fill="#FFA5BA" opacity="0.75"/>

  <!-- Sweet Smile -->
  <path d="M 88 112 Q 100 128 112 112" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Little Stars -->
  <polygon points="152,48 154,54 160,56 154,58 152,64 150,58 144,56 150,54" fill="#FED330"/>
  <circle cx="48" cy="142" r="4.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
