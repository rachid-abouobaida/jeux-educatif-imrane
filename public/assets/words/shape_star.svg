<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="starGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
    <filter id="starShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#A16207" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 5-Pointed Star with softly rounded tips -->
  <path d="M 100 20 
           C 103 20 106 24 108 28
           L 125 64 
           L 165 70 
           C 172 71 175 79 170 84 
           L 141 112 
           L 148 152 
           C 149 160 141 166 134 162 
           L 100 144 
           L 66 162 
           C 59 166 51 160 52 152 
           L 59 112 
           L 30 84 
           C 25 79 28 71 35 70 
           L 75 64 
           L 92 28 
           C 94 24 97 20 100 20 Z" 
        fill="url(#starGrad)" stroke="#CA8A04" stroke-width="5.5" stroke-linejoin="round" filter="url(#starShadow)"/>

  <!-- Top shine overlay -->
  <path d="M 100 28 L 120 68 L 78 68 Z" fill="#FFFFFF" opacity="0.45"/>

  <!-- Happy Star Eyes -->
  <ellipse cx="85" cy="100" rx="7" ry="10" fill="#1E293B"/>
  <ellipse cx="115" cy="100" rx="7" ry="10" fill="#1E293B"/>
  <!-- Catchlights -->
  <circle cx="87" cy="96" r="3" fill="#FFFFFF"/>
  <circle cx="117" cy="96" r="3" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="72" cy="112" rx="7.5" ry="5" fill="#FB7185" opacity="0.65"/>
  <ellipse cx="128" cy="112" rx="7.5" ry="5" fill="#FB7185" opacity="0.65"/>

  <!-- Big Star Smile -->
  <path d="M 90 110 Q 100 124 110 110" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>

  <!-- Extra sparkles on tips -->
  <circle cx="165" cy="65" r="4" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="35" cy="65" r="3.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
